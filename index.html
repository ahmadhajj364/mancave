<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Man Cave</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style id="mc-css">.lk-list{display:grid;gap:6px}
.lk-row{display:grid;grid-template-columns:minmax(120px,1fr) minmax(0,2fr) auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.lk-row:first-child{border-top:0}
.lk-l{font-weight:500;font-size:14px}
.lk-u{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--soft);padding:4px 8px;border-radius:4px}
@media (max-width:600px){.lk-row{grid-template-columns:1fr auto}.lk-u{grid-column:1/-1;grid-row:2}}
.ar-head{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:flex-start}
.ar-head p{margin:4px 0 0;max-width:640px;font-size:14px}
.ar-ctl{display:flex;gap:8px;align-items:center}
.ar-ctl .sel{height:40px;min-width:200px}
.ar-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
@media (max-width:560px){.ar-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.ar-tile{position:relative;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;cursor:grab;transition:box-shadow .15s}
.ar-tile img,.ar-tile .ph{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;pointer-events:none}
.ar-tile.out img{opacity:.55;filter:grayscale(.6)}
.ar-tile.dragging{opacity:.55;box-shadow:0 0 0 2px var(--ok) inset;cursor:grabbing}
.ar-n{position:absolute;top:8px;inset-inline-start:8px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--black);color:#fff;font-size:13px;font-weight:600;display:grid;place-items:center;z-index:1}
.ar-grip{position:absolute;top:6px;inset-inline-end:6px;width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,.92);display:grid;place-items:center;font-size:18px;letter-spacing:-2px;color:var(--ink);touch-action:none;cursor:grab;z-index:1;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.ar-t{padding:8px 10px 4px;display:grid;gap:2px;min-width:0}
.ar-t b{font-size:13px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ar-t span{font-size:12px;color:var(--muted)}
.ar-b{display:flex;gap:6px;padding:6px 10px 10px;margin-top:auto}
.ar-b .sq{flex:1;height:34px}
.st-bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:6px}
.st-seg{margin:0}
.st-nav{display:flex;align-items:center;gap:8px}
.st-nav b{min-width:150px;text-align:center;font-size:15px}
.st-dates{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.st-dates label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.st-dates input{height:38px;padding:0 8px;border:1px solid var(--line);border-radius:4px;font:inherit;color:var(--ink)}
.st-grid.st-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.st-col.fut i{background:transparent}
.st-live{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.st-live .n{font-size:44px;font-weight:600;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.st-live .lbl{display:grid;gap:2px}
.st-live .lbl b{font-size:16px;display:flex;align-items:center;gap:8px}
.st-dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(30,122,76,.5);animation:stpulse 1.8s infinite}
@keyframes stpulse{70%{box-shadow:0 0 0 9px rgba(30,122,76,0)}100%{box-shadow:0 0 0 0 rgba(30,122,76,0)}}
.st-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0}
@media (max-width:760px){.st-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.st-tile{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:4px;min-width:0}
.st-tile span{font-size:13px;color:var(--muted)}
.st-tile .big{font-size:30px;font-weight:600;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.st-tile .sub{font-size:13px;color:var(--muted)}
.st-chart{position:relative;height:180px;padding-inline-start:30px;display:grid;grid-template-columns:repeat(30,minmax(0,1fr));align-items:end;gap:2px;border-bottom:1px solid var(--line);margin-top:22px}
.st-chart .gl{position:absolute;inset-inline:0;border-top:1px dashed #E5E7EB;pointer-events:none}
.st-chart .gl span{position:absolute;inset-inline-start:0;top:-18px;font-size:12px;color:var(--muted);background:#fff;padding-inline-end:4px}
.st-col{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center;cursor:default}
.st-col i{display:block;width:100%;max-width:18px;background:#1E7A4C;border-radius:4px 4px 0 0;min-height:0}
.st-col.today i{background:#145536}
.st-col:hover i,.st-col:focus i{opacity:.75}
.st-col .tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--black);color:#fff;font-size:12px;padding:6px 8px;border-radius:4px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .1s;z-index:2}
.st-col:hover .tip,.st-col:focus .tip{opacity:1}
.st-col:first-child .tip{left:0;transform:none}.st-col:last-child .tip{left:auto;right:0;transform:none}
.st-x{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;padding-inline-start:30px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wa-fab{position:fixed;z-index:60;inset-inline-end:16px;bottom:calc(16px + var(--bottombar));width:52px;height:52px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px -6px rgba(0,0,0,.35);transition:transform .15s}
.wa-fab:hover{transform:scale(1.07)}
.wa-fab:active{transform:scale(.95)}
.wa-fab svg{width:28px;height:28px;fill:#fff}
.wa-fab[hidden]{display:none}
.ord-pop{position:fixed;z-index:9000;left:50%;top:16px;transform:translateX(-50%);width:min(420px,calc(100vw - 32px));background:#fff;border:2px solid var(--ok);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.25);padding:16px;display:grid;gap:10px;animation:popin .25s ease-out}
.ord-pop h3{margin:0;font-size:18px;display:flex;align-items:center;gap:8px;color:var(--ok)}
.ord-pop p{margin:0;font-size:15px;color:var(--ink)}
.ord-pop .muted{font-size:13px}
.ord-pop .acts{display:flex;gap:8px}
.ord-pop .acts .ab{flex:1;justify-content:center;height:44px}
.ord-pop .bell{width:30px;height:30px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;animation:ring 1s ease-in-out 3}
.ord-pop .bell svg.i{width:18px;height:18px}
@keyframes popin{from{opacity:0;transform:translate(-50%,-14px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-18deg)}40%{transform:rotate(16deg)}60%{transform:rotate(-10deg)}80%{transform:rotate(6deg)}}
.ord.fresh{box-shadow:0 0 0 2px var(--ok) inset}
.lockscr{position:fixed;inset:0;z-index:9999;background:#fff;display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.lock-box{width:100%;max-width:320px;text-align:center;display:grid;gap:18px;justify-items:center}
.lock-box .logo-c{width:72px;height:72px;border-radius:50%;overflow:hidden;background:#111;display:grid;place-items:center}
.lock-box .logo-c img{width:100%;height:100%;object-fit:cover}
.lock-box h1{font-size:20px;font-weight:600;margin:0}
.lock-box p{margin:0;color:var(--muted);font-size:14px;min-height:20px}
.lock-box p.err{color:var(--danger)}
.pin-dots{display:flex;gap:16px;justify-content:center;height:18px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--black);display:block}
.pin-dots i.on{background:var(--black)}
.pin-dots.shake{animation:pinshake .35s}
@keyframes pinshake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pin-pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center;direction:ltr}
.pin-pad button{width:72px;height:72px;border-radius:50%;border:1px solid var(--line);background:var(--soft);font-size:26px;font-weight:500;color:var(--ink);display:grid;place-items:center}
.pin-pad button:active{background:#e6e6e6}
.pin-pad button:disabled{opacity:.4}
.pin-pad .ghost{background:none;border:0}
.pin-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pin-row input{width:120px;letter-spacing:6px;text-align:center;font-size:18px}

/* Layout (Cottonil-style shop): utility line, scrolling announcement, centered-logo header + category nav, perks strip, banner slider, photo category tiles, centered product rows, collection grid, dark footer, mobile bottom bar. Admin = full-screen workspace. */
:root{
  --bg:#FFFFFF; --soft:#F5F5F5; --ink:#232323; --muted:#707070; --line:#E8E8E8;
  --black:#111111; --silver:#B5B9BF; --sale:#E4202A; --wa:#128C4A; --ok:#1E7A4C; --warn:#FFF3D1; --danger:#C2312B;
  --font:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --arabic:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --bottombar:0px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:var(--bottombar)}
:root[lang="ar"] body{font-family:var(--arabic)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{-webkit-tap-highlight-color:transparent}
img[data-k]{background:var(--soft)}
button:disabled{cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
:root[dir="rtl"] .flip{transform:scaleX(-1)}
.wrap{max-width:1240px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.vh{position:absolute!important;top:0;left:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* utility + marquee */
.util{font-size:13px;color:var(--ink);border-bottom:1px solid var(--line)}
.util-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:5px}
.util a{text-decoration:none;font-weight:500}
.util-lang{border:0;background:none;padding:2px 0;font-weight:600;font-size:13px}
.marquee{position:relative;background:var(--black);color:#fff;overflow:hidden;white-space:nowrap;font-size:14px;font-weight:500;letter-spacing:.02em}
.mq-track{display:inline-flex;gap:48px;padding-block:8px;padding-inline-start:24px;animation:mq 38s linear infinite}
.mq-track span{display:inline-flex;align-items:center;gap:48px}
.mq-track span::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--silver)}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
:root[dir="rtl"] .mq-track{animation-name:mqr}
@keyframes mqr{from{transform:translateX(0)}to{transform:translateX(50%)}}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.hdr-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-block:10px}
.hdr-l,.hdr-r{display:flex;align-items:center;gap:2px}
.hdr-r{justify-content:flex-end}
.ib{position:relative;width:42px;height:42px;border:0;background:none;border-radius:50%;display:grid;place-items:center}
.ib:hover{background:var(--soft)}
.ib svg.i{width:22px;height:22px}
.badge-n{position:absolute;top:2px;inset-inline-end:0;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--black);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;text-align:start}
.brand img{width:52px;height:52px;border-radius:50%;object-fit:cover;display:block;background:var(--black)}
.brand-mark{width:52px;height:52px;border-radius:50%;background:var(--black);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px}
.brand-txt{display:flex;flex-direction:column;line-height:1.1}
.brand-txt b{font-size:22px;font-weight:700;letter-spacing:.14em}
.brand-txt small{font-size:10px;letter-spacing:.32em;color:var(--muted);text-transform:uppercase;margin-top:3px}
:root[lang="ar"] .brand-txt small{letter-spacing:0;font-size:11px}
.admin-btn{height:34px;padding:0 12px;border-radius:4px;border:0;background:var(--black);color:#fff;font-size:13px;font-weight:600;margin-inline-start:6px;white-space:nowrap}
.nav{display:flex;justify-content:center;gap:2px;flex-wrap:wrap;padding-bottom:6px}
.nav-i{position:relative;flex:none}
.dd{position:absolute;top:100%;inset-inline-start:0;min-width:200px;background:#fff;border:1px solid var(--line);box-shadow:0 18px 36px -18px rgba(0,0,0,.3);padding:8px;display:none;z-index:5;border-radius:4px}
.nav-i:hover .dd,.nav-i:focus-within .dd{display:grid}
.nav .dd button{text-align:start;padding:9px 12px;font-size:14.5px;border-radius:3px;white-space:nowrap}
.nav .dd button::after{display:none}
.nav .dd button:hover{background:var(--soft)}
.nav button{flex:none;border:0;background:none;padding:8px 14px;font-weight:500;font-size:15px;position:relative}
.nav button::after{content:"";position:absolute;inset-inline:14px;bottom:2px;height:2px;background:var(--ink);transform:scaleX(0);transition:transform .2s}
.nav button:hover::after,.nav button[aria-current="true"]::after{transform:scaleX(1)}
.only-m{display:none!important}
@media (max-width:860px){
  :root{--bottombar:calc(60px + env(safe-area-inset-bottom,0px))}
  .only-m{display:grid!important}
  .only-d{display:none!important}
  .nav{display:none}
  .brand-txt{display:none}
  .brand img,.brand-mark{width:46px;height:46px}
}

/* search panel */
.sp{position:absolute;inset-inline:0;top:100%;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 24px 40px -24px rgba(0,0,0,.3)}
.sp-in{padding-block:16px 22px;display:grid;gap:16px}
.sp-field{position:relative}
.sp-field svg.i{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sp-field input{width:100%;height:48px;border:1px solid var(--ink);border-radius:4px;padding-inline:46px 48px;font-size:16px;outline:none}
.sp-field .ib{position:absolute;inset-inline-end:4px;top:3px}
.sp h4{font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
:root[lang="ar"] .sp h4{letter-spacing:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:14px}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.sp-res{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.sp-item{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;border:0;background:none;padding:6px;border-radius:6px;text-align:start}
.sp-item:hover{background:var(--soft)}
.sp-item .ph,.sp-item img{width:56px;height:70px;border-radius:4px;object-fit:cover}
.sp-item b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* perks */
.perks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--soft);margin-block:16px 0}
.perk{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 10px;font-weight:600;font-size:15px;text-align:center}
.perk + .perk{border-inline-start:1px solid #CFCFCF}
.perk svg.i{width:24px;height:24px}
@media (max-width:640px){.perk{flex-direction:column;gap:6px;font-size:12.5px;line-height:1.3;padding:12px 6px}}

/* banner slider */
.slider{position:relative;margin-top:16px;overflow:hidden;background:var(--black);color:#fff}
.slides{display:flex;transition:transform .6s ease}
.slide{flex:0 0 100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:440px}
.slide-txt{display:flex;flex-direction:column;justify-content:center;gap:16px;padding:48px clamp(24px,5vw,72px)}
.slide-eye{font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--silver);font-weight:500}
:root[lang="ar"] .slide-eye{letter-spacing:0;font-size:15px}
.slide h2{font-size:clamp(30px,4.2vw,50px);font-weight:600;line-height:1.08}
.slide p{color:#D7D9DC;font-size:17px;max-width:440px}
.slide-img{position:relative;min-height:280px;background:#1c1c1c}
.slide-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%}
.shop-now{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 26px;border:1px solid #fff;background:rgba(17,17,17,.35);color:#fff;text-transform:uppercase;font-weight:600;letter-spacing:.08em;font-size:14px;text-decoration:none;border-radius:2px}
.shop-now:hover{background:#fff;color:var(--black)}
:root[lang="ar"] .shop-now{letter-spacing:0}
.sl-arrow{position:absolute;bottom:16px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:var(--black);display:grid;place-items:center;z-index:2}
.sl-prev{inset-inline-end:68px}.sl-next{inset-inline-end:16px}
.dots{position:absolute;bottom:14px;inset-inline:0;display:flex;justify-content:center;gap:8px;z-index:2}
.dots button{width:26px;height:26px;border:0;background:none;padding:0;display:grid;place-items:center}
.dots button::after{content:"";width:9px;height:9px;border-radius:50%;border:1px solid #fff}
.dots button[aria-current="true"]::after{background:#fff}
@media (max-width:760px){
  .slide{grid-template-columns:1fr;min-height:0}
  .slide-img{order:-1;aspect-ratio:4/3;min-height:0}
  .slide-txt{padding:24px 20px 48px;gap:12px}
  .slide p{font-size:15px}
  .sl-arrow{display:none}
}

/* sections */
.sec{padding-block:44px 4px}
.sec-t{font-size:clamp(22px,2.6vw,28px);font-weight:700;text-align:center;margin-bottom:22px}
.sec-sub{text-align:center;margin:-14px 0 20px;color:var(--muted);font-size:14px}
.view-all{display:flex;justify-content:center;margin-top:22px}
.btn-o{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 24px;border:1px solid var(--ink);background:#fff;text-transform:uppercase;font-weight:600;letter-spacing:.06em;font-size:13px;border-radius:2px;text-decoration:none}
.btn-o:hover{background:var(--ink);color:#fff}
:root[lang="ar"] .btn-o{letter-spacing:0;font-size:14px}
.btn-f{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border:0;background:var(--black);color:#fff;text-transform:uppercase;font-weight:600;letter-spacing:.06em;font-size:14px;border-radius:2px;text-decoration:none}
.btn-f:hover{background:#333}
.btn-f:disabled{background:#A7A7A7}
:root[lang="ar"] .btn-f{letter-spacing:0}
.btn-wa{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border:0;background:var(--wa);color:#fff;font-weight:600;font-size:15px;border-radius:2px;text-decoration:none}
.btn-wa:hover{background:#0E7A40}

/* category tiles */
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.cat{position:relative;border:0;padding:0;background:var(--soft);border-radius:4px;overflow:hidden;aspect-ratio:4/5;text-align:start;color:#fff}
.cat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.cat:hover img{transform:scale(1.04)}
.cat::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.72),rgba(0,0,0,0) 55%)}
.cat-l{position:absolute;inset-inline:0;bottom:0;padding:16px;z-index:1;display:grid;gap:2px}
.cat-l b{font-size:19px;font-weight:600;line-height:1.2}
.cat-l span{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:#E3E5E8}
:root[lang="ar"] .cat-l span{letter-spacing:0;font-size:13px}
.cat .ph{position:absolute;inset:0}
@media (max-width:860px){.cats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cat-l b{font-size:16px}}

/* product rows */
.rowwrap{position:relative}
.row{display:grid;justify-content:safe center;grid-auto-flow:column;grid-auto-columns:calc((100% - 3*18px)/4);gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.row::-webkit-scrollbar{display:none}
.row > *{scroll-snap-align:start}
@media (max-width:1000px){.row{grid-auto-columns:calc((100% - 2*14px)/3);gap:14px}}
@media (max-width:640px){.row{grid-auto-columns:calc((100% - 12px)/2.15);gap:12px}}
.r-arrow{position:absolute;top:34%;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;z-index:2;box-shadow:0 4px 14px -6px rgba(0,0,0,.25)}
.r-prev{inset-inline-start:-14px}.r-next{inset-inline-end:-14px}
@media (max-width:860px){.r-arrow{display:none}}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px 18px}
@media (max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px}}

/* product card */
.card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-width:0;height:100%}
.c-media{position:relative;width:100%;border-radius:4px;overflow:hidden;background:var(--soft)}
.c-img{display:block;width:100%;border:0;padding:0;background:none}
.c-img img,.c-img .ph{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;max-width:100%}
.c-img img{transition:transform .4s}
.card:hover .c-img img{transform:scale(1.04)}
.ph{display:grid;place-items:center;background:var(--soft);color:#9A9EA4}
.ph svg.i{width:48px;height:48px;stroke-width:1.3}
.c-tag{position:absolute;top:10px;inset-inline-start:10px;background:var(--sale);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:2px}
.c-tag.dark{background:var(--black)}
.c-icons{position:absolute;top:8px;inset-inline-end:8px;display:grid;gap:6px}
.c-icons button{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 2px 8px -3px rgba(0,0,0,.25)}
.c-icons svg.i{width:17px;height:17px}
.c-icons button[aria-pressed="true"]{color:var(--sale)}
.c-icons button[aria-pressed="true"] svg{fill:var(--sale)}
.c-strip{position:absolute;inset-inline:0;bottom:0;background:var(--sale);color:#fff;overflow:hidden;white-space:nowrap;font-size:12px;font-style:italic;font-weight:500;pointer-events:none}
.c-strip span{display:inline-flex;gap:22px;padding-block:3px;padding-inline-start:10px;animation:mq 16s linear infinite}
:root[dir="rtl"] .c-strip span{animation-name:mqr}
.card.out .c-img img{filter:grayscale(.8);opacity:.6}
.c-vendor{font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:6px}
.c-name{border:0;background:none;padding:0;font-size:15px;line-height:1.35;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.c-name:hover{text-decoration:underline;text-underline-offset:3px}
.c-price{margin-bottom:6px;display:flex;gap:8px;align-items:baseline;justify-content:center;flex-wrap:wrap;font-variant-numeric:tabular-nums;font-weight:600;font-size:16px}
.c-price s{color:var(--muted);font-weight:400;font-size:14px}
.c-price .now.sale{color:var(--sale)}
.c-more{font-size:11.5px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
:root[lang="ar"] .c-more{letter-spacing:0;font-size:12px}
.c-add{width:100%;height:42px;margin-top:auto;border:1px solid var(--ink);background:#fff;text-transform:uppercase;font-weight:600;letter-spacing:.08em;font-size:13px;border-radius:2px}
.c-add:hover{background:var(--ink);color:#fff}
.c-add:disabled{border-color:var(--line);color:var(--muted);background:var(--soft)}
:root[lang="ar"] .c-add{letter-spacing:0;font-size:14px}

/* collection page */
.crumbs{font-size:13px;color:var(--muted);padding-top:20px;display:flex;gap:6px;flex-wrap:wrap}
.crumbs button{border:0;background:none;padding:0;color:var(--muted)}
.crumbs button:hover{color:var(--ink);text-decoration:underline}
.col-h{text-align:center;padding-block:14px 6px}
.col-h h1{font-size:clamp(26px,3.2vw,34px);font-weight:700}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:16px;border-block:1px solid var(--line);margin-block:18px 26px}
.toolbar .chips{flex:1;min-width:0}
.tb-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toggle{height:36px;padding:0 14px;border:1px solid var(--line);background:#fff;border-radius:999px;font-size:14px}
.toggle[aria-pressed="true"]{background:var(--sale);border-color:var(--sale);color:#fff}
.sel{height:36px;border:1px solid var(--line);background:#fff;border-radius:4px;padding:0 10px;font-size:14px}
.empty{grid-column:1/-1;text-align:center;padding:48px 16px;background:var(--soft);border-radius:4px;display:grid;gap:14px;justify-items:center}
.sample-note{text-align:center;font-size:13px;color:var(--muted);margin-top:28px}

/* footer */
.foot{background:var(--black);color:#C9CBCF;margin-top:64px}
.foot-g{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.3fr;gap:32px;padding-block:48px 32px}
.foot h4{color:#fff;font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;margin-bottom:14px}
:root[lang="ar"] .foot h4{letter-spacing:0}
.foot .brand{color:#fff;margin-bottom:14px}
.foot .brand-txt{display:flex}
.foot .brand-txt small{color:var(--silver)}
.foot-links{display:grid;gap:2px;justify-items:start}
.foot-links button,.foot-links a,.foot-links span{min-height:32px;display:inline-flex;align-items:center}
.foot-links button,.foot-links a{border:0;background:none;padding:0;color:#C9CBCF;text-decoration:none;text-align:start;font-size:14.5px}
.foot-links button:hover,.foot-links a:hover{color:#fff;text-decoration:underline}
.crow{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;font-size:14.5px;min-width:0}
.crow svg.i{color:var(--silver);margin-top:2px;width:18px;height:18px}
.crow span,.crow a{overflow-wrap:anywhere;user-select:text}
.crow a{color:#fff}
.foot-b{border-top:1px solid #2A2A2A;padding-block:16px;font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#8F9298}
@media (max-width:860px){.foot-g{grid-template-columns:1fr 1fr}.foot-g > :first-child{grid-column:1/-1}}

/* bottom bar (mobile) */
.bbar{position:fixed;z-index:55;inset-inline:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:none;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bbar button{border:0;background:none;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;position:relative;color:var(--muted)}
.bbar button[aria-current="true"]{color:var(--ink);font-weight:600}
.bbar button[aria-current="true"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--ink)}
.bbar .badge-n{top:6px;inset-inline-end:calc(50% - 22px)}
@media (max-width:860px){.bbar{display:grid}}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70}
.x{width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);display:grid;place-items:center}
.x:hover{background:var(--line)}
.modal{position:fixed;z-index:71;left:50%;top:50%;transform:translate(-50%,-50%);width:min(940px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;background:#fff;border-radius:6px;box-shadow:0 30px 80px -30px rgba(0,0,0,.5)}
.modal > .x{position:absolute;top:12px;inset-inline-end:12px;z-index:2}
.pm{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;padding:28px}
.pm-img img,.pm-img .ph{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:4px;display:block;max-width:100%}
.pm-img .ph svg.i{width:90px;height:90px}
.pm-info{display:flex;flex-direction:column;gap:14px;min-width:0;padding-top:10px}
.pm-info h2{font-size:26px;font-weight:600;line-height:1.2}
.pm-price{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.pm-price s{color:var(--muted);font-size:18px;font-weight:400}
.pm-price .sale{color:var(--sale)}
.pm-price .c-tag{position:static}
.desc{color:#4A4A4A}
.opt-l{font-size:14px;font-weight:600;margin-bottom:8px}
.ochips{display:flex;flex-wrap:wrap;gap:8px}
.ochip{min-width:48px;height:40px;padding:0 14px;border:1px solid var(--line);background:#fff;border-radius:2px;font-weight:500}
.ochip:hover{border-color:var(--ink)}
.ochip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:2px;height:44px}
.stepper button{width:42px;height:42px;border:0;background:none;display:grid;place-items:center}
.stepper button:hover{background:var(--soft)}
.stepper b{min-width:30px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.stepper.sm{height:34px}.stepper.sm button{width:32px;height:32px}.stepper.sm svg.i{width:15px;height:15px}
.pm-cta{display:flex;gap:10px}
.pm-cta .btn-f{flex:1}
.heart-b{width:48px;height:48px;border:1px solid var(--line);background:#fff;border-radius:2px;display:grid;place-items:center}
.heart-b[aria-pressed="true"]{color:var(--sale);border-color:var(--sale)}
.heart-b[aria-pressed="true"] svg{fill:var(--sale)}
.err{color:var(--danger);font-size:14px;font-weight:500}
@media (max-width:720px){
  .modal{left:0;right:0;top:auto;bottom:0;transform:none;width:100%;max-height:94%;border-radius:12px 12px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .pm{grid-template-columns:1fr;gap:14px;padding:16px max(16px,env(safe-area-inset-right,0px)) 22px max(16px,env(safe-area-inset-left,0px))}
  .pm-img img,.pm-img .ph{aspect-ratio:1}
  .pm-info{padding-top:0}
}
.drawer{position:fixed;z-index:71;top:0;bottom:0;inset-inline-end:0;width:min(440px,100%);background:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 0 60px -20px rgba(0,0,0,.5)}
.drawer.start{inset-inline-end:auto;inset-inline-start:0}
.dr-h{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.dr-h h2{font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
:root[lang="ar"] .dr-h h2{letter-spacing:0}
.dr-h .x{margin-inline-start:auto}
.dr-b{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:16px}
.dr-f{border-top:1px solid var(--line);padding:14px 20px;display:grid;gap:8px}
.ln{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:start}
.ln img,.ln .ph{width:72px;aspect-ratio:4/5;object-fit:cover;border-radius:3px;display:block}
.ln .ph svg.i{width:26px;height:26px}
.ln-i{display:flex;flex-direction:column;gap:4px;min-width:0}
.ln-i b{font-weight:500;line-height:1.3}
.ln-i span{font-size:13px;color:var(--muted)}
.ln-e{display:flex;flex-direction:column;align-items:flex-end;gap:8px;font-variant-numeric:tabular-nums}
.link{border:0;background:none;padding:8px 0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}
.sum{display:flex;justify-content:space-between;font-size:14px;font-variant-numeric:tabular-nums}
.sum.total{font-size:18px;font-weight:700}
.co{display:grid;gap:10px;padding-top:10px;border-top:1px solid var(--line)}
.co h3{font-size:16px;font-weight:600}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;height:46px;border:1px solid var(--line);border-radius:3px;padding:0 12px;background:#fff;outline:none;font-size:16px}
.field textarea{height:auto;min-height:72px;padding:10px 12px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--ink)}
.cod{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:3px;padding:10px 12px;font-size:14px;font-weight:500}
.dr-empty{margin:auto;text-align:center;color:var(--muted);max-width:280px;display:grid;gap:14px;justify-items:center}
.dr-empty svg.i{width:44px;height:44px;color:#C9C9C9;stroke-width:1.3}
.menu-l{display:grid}
.menu-l button{border:0;border-bottom:1px solid var(--line);background:none;padding:14px 2px;text-align:start;font-size:16px;font-weight:500;display:flex;justify-content:space-between;align-items:center}
.toast{position:fixed;z-index:100;left:50%;bottom:calc(20px + var(--bottombar));transform:translateX(-50%);background:var(--black);color:#fff;padding:12px 18px;border-radius:4px;font-weight:500;font-size:14px;box-shadow:0 14px 40px -12px rgba(0,0,0,.6);max-width:calc(100% - 32px);text-align:center}

/* admin */
.adm{position:fixed;inset:0;z-index:80;background:#F3F4F6;overflow:auto;font-family:var(--font)}
.adm-top{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:3;padding-top:env(safe-area-inset-top,0px)}
.adm-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
.adm-title{display:flex;align-items:center;gap:10px;font-weight:600;margin-inline-end:auto}
.adm-title img{width:36px;height:36px;border-radius:50%}
.pill{display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:4px 12px;line-height:1.35;overflow-wrap:anywhere;border-radius:999px;font-size:13px;font-weight:500;background:#E2F2E8;color:#1E6B45}
.pill::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.warn{background:var(--warn);color:#875800}
.adm-actions{display:flex;gap:8px;flex-wrap:wrap}
.ab{height:38px;padding:0 16px;border-radius:4px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ab:hover{border-color:var(--ink)}
.ab.dark{background:var(--black);color:#fff;border-color:var(--black)}
.ab.go{background:var(--wa);color:#fff;border-color:var(--wa)}
.ab.red{background:var(--danger);color:#fff;border-color:var(--danger)}
.ab:disabled{opacity:.45}
.ab svg.i{width:16px;height:16px}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.adm-body{padding-block:22px 60px;display:grid;gap:16px}
.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px;min-width:0}
.panel h3{font-size:16px;font-weight:600;margin-bottom:14px}
.adm-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:#fff;border:1px solid var(--line);border-radius:6px;padding:7px 12px;font-size:13px;color:var(--muted)}
.stat b{color:var(--ink);font-size:15px;margin-inline-end:4px;font-variant-numeric:tabular-nums}
.notice{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn);border-radius:6px;padding:12px 16px;font-size:14px}
.filters{display:flex;gap:10px;flex-wrap:wrap}
.filters input,.filters select{height:40px;border:1px solid var(--line);border-radius:4px;padding:0 12px;background:#fff;min-width:0}
.filters input{flex:1;min-width:180px}
.tbl{overflow-x:auto;padding:0}
table{width:100%;border-collapse:collapse;min-width:760px;font-size:14px}
th{text-align:start;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line)}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle;text-align:start}
tr:last-child td{border-bottom:0}
.th img,.th .ph{width:44px;height:55px;object-fit:cover;border-radius:3px;display:block}
.th .ph svg.i{width:20px;height:20px}
.ar-sub{font-family:var(--arabic);color:var(--muted);font-size:13px}
.st{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;border:0;margin:2px}
.st.on{background:#E2F2E8;color:#1E6B45}.st.off{background:#FBE3DF;color:#9E2F22}
.st.sale{background:var(--sale);color:#fff}.st.feat{background:#E7EEF8;color:#2A5788}.st.smp{background:var(--soft);color:var(--muted);border:1px dashed #D0D0D0}
button.st{cursor:pointer}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;white-space:nowrap}
.acts button{height:32px;padding:0 12px;border-radius:4px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:500}
.acts button:hover{border-color:var(--ink)}
.acts .danger{color:var(--danger)}
.acts .danger-fill{background:var(--danger);border-color:var(--danger);color:#fff}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fgrid .full{grid-column:1/-1}
.help{font-size:12px;color:var(--muted);margin-top:4px}
.check{display:flex;gap:10px;align-items:center;font-weight:500;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--black)}
@media (max-width:640px){.fgrid{grid-template-columns:1fr}}
.crow-a{display:grid;grid-template-columns:56px minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line)}
.crow-a:last-child{border-bottom:0}
.crow-a img,.crow-a .ph{width:56px;height:56px;object-fit:cover;border-radius:4px;display:block}
.crow-a input{height:40px;border:1px solid var(--line);border-radius:4px;padding:0 10px;width:100%;background:#fff;min-width:0}
.ctools{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.sq{width:34px;height:34px;border-radius:4px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;position:relative;overflow:hidden}
.sq svg.i{width:16px;height:16px}
.sq:disabled{opacity:.4}
.sq input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
@media (max-width:760px){.crow-a{grid-template-columns:56px minmax(0,1fr)}.crow-a > *:nth-child(n+3){grid-column:2}}
.brow{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:14px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow img,.brow .ph{width:120px;height:80px;object-fit:cover;border-radius:4px;display:block}
@media (max-width:640px){.brow{grid-template-columns:80px minmax(0,1fr)}.brow img,.brow .ph{width:80px;height:60px}.brow > .acts{grid-column:1/-1;justify-content:flex-start}}

/* ---------- slider ---------- */
var autoT=null;
function setSlide(i,instant){
  var n=DATA.banners.length;if(!n)return;S.slide=((i%n)+n)%n;
  var el=$("slides");if(!el)return;
  var dir=document.documentElement.dir==="rtl"?1:-1;
  if(instant){el.style.transition="none";}
  el.style.transform="translateX("+(dir*S.slide*100)+"%)";
  if(instant){void el.offsetWidth;el.style.transition="";}
  el.querySelectorAll(".slide").forEach(function(s,k){if(k===S.slide)s.removeAttribute("aria-hidden");else s.setAttribute("aria-hidden","true");});
  document.querySelectorAll(".dots button").forEach(function(d,k){d.setAttribute("aria-current",k===S.slide);});
}
function startAuto(){
  clearInterval(autoT);
  var reduce=false;try{reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){}
  if(reduce||DATA.banners.length<2)return;
  autoT=setInterval(function(){if(!S.view&&!S.drawer&&!S.admin&&$("slides"))setSlide(S.slide+1);},6000);
}

function placeOrder(){
  if(S.placing)return;
  if(!validateCo()){S.coMsg=T("co_fix");renderCheckout();var first=document.querySelector('[aria-invalid="true"]');if(first)first.focus();return;}
  S.coMsg="";S.coWa=false;
  if(!ordUrl()){goWa(waLink(orderText()));return;}
  var t=totals(),f=S.form,hp=($("co-website")||{}).value||"";
  var items=S.cart.map(function(l){var p=prodById(l.id);if(!p)return null;var c=colorsOf(p);return{id:p.id,name:p.name_en||p.name_ar,name_ar:p.name_ar||"",size:l.size||"",color:(l.ci>-1&&list(p.colors_en)[l.ci])||"",qty:l.qty,price:priced(p)?Number(p.price):null};}).filter(Boolean);
  var payload={lang:S.lang,name:f.name.trim(),phone:f.phone.trim(),email:String(f.email||"").trim(),area:f.area.trim(),address:f.address.trim(),notes:String(f.notes||"").trim(),items:items,subtotal:t.sub,delivery:t.tbc?null:t.del,total:t.total,currency:DATA.settings.currency||"$",payment:"cod",website:hp,page:location.href.split("#")[0]};
  S.placing=true;renderCheckout();
  var hard={missing_fields:1,bad_phone:1,empty_cart:1,bad_item:1,bad_email:1};
  var fail=function(){S.placing=false;S.coWa=!!waNum();var ph=DATA.settings.phone||"";S.coMsg=T("co_fail")+(ph?" "+T("co_fail2",{p:ph}):"");renderCheckout();var a=document.querySelector(".co-alert");if(a)a.scrollIntoView({block:"center"});};
  var send=function(n){
    var ctl=window.AbortController?new AbortController():null,tm=setTimeout(function(){if(ctl)ctl.abort();},25000);
    fetch(ordUrl(),{method:"POST",body:JSON.stringify(payload),signal:ctl?ctl.signal:undefined}).then(function(r){return r.json();}).then(function(j){
      clearTimeout(tm);if(!j||!j.ok){var e=new Error(j&&j.error||"failed");e.hard=!!(j&&hard[j.error]);throw e;}
      S.lastOrder={id:j.id,name:payload.name,phone:payload.phone,email:payload.email,items:payload.items,total:payload.total,req:t.req,tbc:t.tbc,del:t.del,sub:t.sub,wa:waNum()?waLink(orderText(j.id)):""};
      px("Purchase",{content_ids:payload.items.map(function(x){return x.id;}),contents:payload.items.map(function(x){return{id:x.id,quantity:x.qty};}),num_items:payload.items.reduce(function(a,x){return a+x.qty;},0),content_type:"product",value:payload.total,currency:pxCur()},{eventID:String(j.id)});
      ssSet("mc_last",S.lastOrder);S.cart=[];saveCart();S.placing=false;S.coErrs={};
      S.page="done";renderMain();window.scrollTo({top:0});pushSt(true);
      if(S.lastOrder.wa&&isTouch()){var once=S.lastOrder;setTimeout(function(){if(S.page==="done"&&!once.waGone){once.waGone=true;ssSet("mc_last",once);location.href=once.wa;}},1200);}
    }).catch(function(e){clearTimeout(tm);
      /* busy or bad connection: try again quietly (the order system ignores repeats from the same phone) */
      if(!e.hard&&n<4&&S.page==="checkout"){setTimeout(function(){send(n+1);},[1500,4000,8000][n-1]+Math.random()*[1000,2000,3000][n-1]);return;}
      fail();});
  };
  send(1);
}

var addingPhotos=false;
function addPhotos(files){
  if(!S.edit||S.edit.type!=="product")return;var list=[].slice.call(files||[]).filter(function(f){return /^image\//.test(f.type)||/\.(jpe?g|png|webp|gif|heic)$/i.test(f.name);});
  var room=12-S.edit.d.imgs.length;if(!list.length){toast("Choose image files (JPG or PNG).");return;}if(room<=0){toast("This product already has 12 photos.");return;}
  var skipped=list.length>room?list.length-room:0;list=list.slice(0,room);var done=0,bad=0;addingPhotos=true;
  (function next(){if(!S.edit){addingPhotos=false;return;}if(done+bad>=list.length){addingPhotos=false;var el=$("ed-photo");if(el)el.innerHTML=photosBlock();toast("Added "+done+" photo"+(done===1?"":"s")+(bad?". "+bad+" couldn't be read":"")+(skipped?". "+skipped+" skipped (12 max)":"")+".");return;}
    toast("Adding photos "+(done+bad+1)+" of "+list.length+"…");

function packData(){
  var D=JSON.parse(JSON.stringify(DATA)),map={},rev={},n=0;
  function pk(v){if(!v)return v;v=String(v);if(v.charAt(0)==="@"){var u=IMG[v.slice(1)];if(!u)return v;v=u;}if(v.indexOf("data:")!==0)return v;if(rev[v])return "@"+rev[v];var k="i"+(n++);rev[v]=k;map[k]=v;return "@"+k;}
  D.products.forEach(function(p){p.imgs=(p.imgs||[]).map(pk);});D.banners.forEach(function(b){b.img=pk(b.img);});D.categories.forEach(function(c){c.img=pk(c.img);});D.settings.logo=pk(D.settings.logo);
  return{D:D,map:map};
}
function buildDoc(adm){

function publish(){
  if(!IMG_READY){toast("Photos are still loading. Try again in a moment.");return;}
  if(S.standalone&&ghOn())return ghPublish();
  if(S.standalone){try{var save=function(name,html){var bl=new Blob([html],{type:"text/html"}),a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download=name;document.body.appendChild(a);a.click();a.remove();};save("index.html",buildDoc(false));setTimeout(function(){save("admin.html",buildDoc(true));},700);S.dirty=false;renderAdminTop();toast("Saved index.html and admin.html. Replace the old files with these two (keep the images folder).");}catch(err){toast("Couldn't save the files. Try another browser.");}return;}
  if(!cap.artifact){toast("Publishing isn't available in this view.");return;}
  S.busy=true;renderAdminTop();ssSet("mc_admin",{tab:S.atab,done:true});
  var html=buildDoc(false),filesFail=function(c){return c==="capability_disabled"||c==="capability_removed"||c==="invalid_content"||c==="transform_error"||c==="read_only_path";};
  cap.artifact.publish({"index.html":{content:html,contentType:"text/html"}}).then(function(){ssDel("mc_admin");S.busy=false;S.dirty=false;try{ORIG=JSON.stringify(DATA);}catch(e){}renderAdminTop();toast("Published. Your changes are live.");},function(e){if(e&&filesFail(e.code))return cap.artifact.publish(html).then(function(){S.dirty=false;toast("Published. The live store is reloading.");});throw e;}).catch(function(e){
    S.busy=false;ssDel("mc_admin");var c=e&&e.code,m;
    if(c==="conflict")m="Someone else published first. The page is reloading to their version.";
    else if(c==="not_writer"||c==="not_granted"||c==="consent_required"||c==="capability_disabled")m="This view can't publish. Open the store as its editor to publish.";
    else if(c==="too_large")m="The store is too big to save. Use fewer or smaller photos.";
    else if(c==="rate_limited")m="Publishing too often. Wait a minute and publish again.";
    else m="Couldn't publish. Check your connection and try again.";
    renderAdminTop();toast(m);});
}

  var ek=el.getAttribute("data-e");if(ek&&S.edit){var prevC=catById(S.edit.d.cat);S.edit.d[ek]=el.type==="checkbox"?el.checked:el.value;if(ek==="cat"&&S.edit.type==="product"){S.edit.d.sub="";var cc=catById(el.value),curS=String(S.edit.d.sizes||"").trim();if(!curS||(prevC&&curS===String(prevC.sizes||"").trim()))S.edit.d.sizes=(cc&&cc.sizes)||"";renderEditor();}return;}
  var sc=el.getAttribute("data-sc");if(sc){var cs=DATA.categories[parseInt(el.getAttribute("data-i"),10)];var sj=cs&&cs.subs&&cs.subs[parseInt(el.getAttribute("data-j"),10)];if(sj){sj[sc]=el.value;markDirty();}return;}
  var sk=el.getAttribute("data-s");if(sk){DATA.settings[sk]=el.hasAttribute("data-num")?(parseFloat(el.value)||0):el.value;markDirty();return;}
  var ck=el.getAttribute("data-c");if(ck){DATA.categories[parseInt(el.getAttribute("data-i"),10)][ck]=el.value;markDirty();return;}
  if(el.id==="aq"){S.aq=el.value;renderAdminTable();}
  if(el.id==="oq"){S.ordQ=el.value;var pos=el.selectionStart;renderAdminBody();var n=$("oq");if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}}
});
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.id==="arcat"&&S.arr){S.arr.cat=el.value;renderAdminBody();return;}
  if(el.id==="sort"){S.sort=el.value;S.limit=24;renderGrid();return;}
  if(el.id==="acat"){S.acat=el.value;renderAdminTable();return;}
  if(el.hasAttribute("data-ost")){var oid=el.getAttribute("data-ost"),st=el.value,o=(S.orders||[]).filter(function(x){return x.id===oid;})[0];if(!o)return;var prev=o.status;o.status=st;renderAdminTop();renderAdminBody();
    ordApi({action:"update",key:ordKey(),id:oid,status:st}).then(function(){toast(oid+" marked "+st+".");}).catch(function(){o.status=prev;renderAdminTop();renderAdminBody();toast("Couldn't update the order. Try again.");});return;}
  var file=el.files&&el.files[0];if(!file)return;
  if(el.id==="ef-files"&&S.edit){addPhotos(el.files);el.value="";return;}
  if(el.id==="ef-file"&&S.edit){readImage(file,S.edit.type==="banner"?1100:800).then(function(u){if(!S.edit)return;S.edit.d.img=u;S.edit.err="";$("ed-photo").innerHTML=photoBlock();}).catch(function(){if(S.edit){S.edit.err="That file couldn't be read as an image. Try a JPG or PNG.";renderEditor();}});return;}
  if(el.hasAttribute("data-cimg")){var ci=parseInt(el.getAttribute("data-cimg"),10);readImage(file,700).then(function(u){DATA.categories[ci].img=u;markDirty();renderAdminBody();toast("Category photo updated.");}).catch(function(){toast("That file couldn't be read as an image.");});return;}
  if(el.id==="s-logo"){readImage(file,320).then(function(u){DATA.settings.logo=u;markDirty();renderAdminTop();renderAdminBody();toast("Logo updated.");}).catch(function(){toast("That file couldn't be read as an image.");});}
});
document.addEventListener("dragover",function(e){var d=e.target&&e.target.closest&&e.target.closest("#ed-drop");if(d){e.preventDefault();d.classList.add("over");}else if(S.edit)e.preventDefault();});
document.addEventListener("dragleave",function(e){var d=e.target&&e.target.closest&&e.target.closest("#ed-drop");if(d)d.classList.remove("over");});
document.addEventListener("drop",function(e){if(!S.edit)return;e.preventDefault();var d=$("ed-drop");if(d)d.classList.remove("over");if(S.edit.type==="product"&&e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length)addPhotos(e.dataTransfer.files);});
document.addEventListener("submit",function(e){if(e.target&&e.target.id==="cof"){e.preventDefault();placeOrder();}});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){if(S.edit){S.edit=null;renderEditor();}else if(S.view||S.drawer){closeOverlay();}else if(S.search){S.search=false;renderSearch();}}
  if(e.key==="Enter"&&e.target&&e.target.id==="sq"){S.saleOnly=false;goCol("all");}
});

/* other tabs: keep cart and wishlist in step */
window.addEventListener("storage",function(e){
  if(e.key!=="mc_cart"&&e.key!=="mc_wish")return;
  var v=null;try{v=JSON.parse(e.newValue||"[]");}catch(x){v=[];}
  if(e.key==="mc_cart"){if(S.placing)return;S.cart=cleanCart(v).filter(function(l){return !!prodById(l.id);});if(S.drawer==="cart")renderDrawer();if(S.page==="checkout"&&$("cof"))renderCheckout();else if(S.page==="checkout")renderMain();}
  else{S.wish=cleanWish(v).filter(function(x){return !!prodById(x);});if(S.drawer==="wish")renderDrawer();}
  counts();
});
/* boot */
try{var h0=history.state;if(h0&&h0.mc&&(h0.p==="checkout"||h0.p==="done"))S.page=h0.p;}catch(e){}
initPixel();routeFromUrl();
shell();renderAll();
try{var st0=snap();if(S.openAfter)st0.v=null;history.replaceState(st0,"",(S.standalone||window.__MC_ADMIN===true||location.hash==="#admin")?undefined:(S.page==="col"?urlFor(st0):(location.search?location.pathname:undefined)));}catch(e){}
if(S.openAfter){var oa=S.openAfter;S.openAfter=null;openProduct(oa);}
window.MC_IMG();document.addEventListener("DOMContentLoaded",function(){window.MC_IMG();});
(function(){var x0=null,y0=0;document.addEventListener("touchstart",function(e){var t=e.target&&e.target.closest&&e.target.closest(".slider");if(!t){x0=null;return;}x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});document.addEventListener("touchend",function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.2){var rtl=document.documentElement.dir==="rtl";setSlide(S.slide+(((dx<0)!==rtl)?1:-1));startAuto();}},{passive:true});})();
if(!(window.claude&&typeof window.claude.use==="function")&&(location.hash==="#admin"||window.__MC_ADMIN===true)){adminBoot();}
else if(!(window.claude&&typeof window.claude.use==="function")){setTimeout(track,1200);}
if(window.claude&&typeof window.claude.use==="function"){
  window.claude.use("artifact").then(function(a){cap.artifact=a;checkEdit();}).catch(function(){});
  window.claude.use("user").then(function(u){cap.user=u;checkEdit();}).catch(function(){});
}
function checkEdit(){
  if(!cap.user||!cap.artifact||S.canEdit)return;
  Promise.resolve(cap.user.canEdit()).then(function(ok){
    if(!ok)return;S.canEdit=true;renderHeader();
    var re=ssGet("mc_admin");
    if(re){ssDel("mc_admin");openAdmin(re.tab);if(re.done)toast("Your changes are live.");}
    else if(location.hash==="#admin")openAdmin();
  }).catch(function(){});
}
})();
